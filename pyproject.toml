[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-board-opt"
version = "0.1.0"
description = "Board-specific LLM optimization framework for llama.cpp"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.scripts]
board-opt = "board_opt.cli:main"

[tool.setuptools.packages.find]
include = ["board_opt*"]

[tool.pytest.ini_options]
pythonpath = ["."]
